services:
  # 1. Fullstack All-in-One Service (Frontend + Backend + Database บนโดเมนเดียว ใช้งานได้ 100%)
  - type: web
    name: engineering-faculty-app
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true

  # 2. Frontend Static Site
  - type: web
    name: engineering-faculty-web
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
